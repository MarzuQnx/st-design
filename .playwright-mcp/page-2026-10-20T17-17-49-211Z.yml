        - generic [ref=f8e200]:
          - generic [ref=f8e201]:
            - button "Apakah saya bisa membawa bahan baku resep sendiri untuk uji coba mesin sebelum membeli?" [expanded] [ref=f8e202] [cursor=pointer]
            - paragraph [ref=f8e207]: Sangat bisa dan sangat kami anjurkan! Setiap adonan tepung, kekentalan saus, dan kelembapan biskuit memiliki sifat unik. Di Test Kitchen Showroom kami di Pantai Indah Kapuk (Jakarta) dan workshop Bekasi, Anda dipersilakan membawa bahan baku asli dan mencoba mesin didampingi sales engineer kami tanpa dipungut biaya sepeser pun dan tanpa paksaan membeli.
          - generic [ref=f8e208]:
            - button "Bagaimana prosedur penjadwalan demo mesin di showroom?" [ref=f8e209] [cursor=pointer]
            - paragraph [ref=f8e214]: Cukup hubungi tim kami via WhatsApp atau isi formulir reservasi kunjungan di halaman ini minimal 1 hari kerja sebelumnya. Beritahukan tipe mesin yang ingin diuji coba dan perkiraan jumlah bahan yang Anda bawa agar tim engineer kami dapat menyiapkan unit demo dalam kondisi prima dan terkalibrasi.
          - generic [ref=f8e215]:
            - button "Bagaimana jika tempat usaha saya masih menggunakan daya listrik 220V 1-Phase (bukan 380V)?" [ref=f8e216] [cursor=pointer]
            - paragraph [ref=f8e221]: Banyak lini mesin Relasi Sukses (seperti Spiral Mixer 20L, Dough Sheeter, Encrusting Machine UMKM, Band Sealer, dan Deck Oven gas) dirancang khusus beroperasi efisien pada daya 220V standar rumahan (2.200 - 4.400 VA). Jika Anda berencana menggunakan mesin kapasitas besar 380V, sales engineer kami siap memberikan konsultasi gratis mengenai instalasi inverter pengubah fase atau panduan penambahan daya PLN.
          - generic [ref=f8e222]:
            - button "Apakah teknisi Relasi Sukses membantu instalasi kelistrikan awal saat mesin tiba di tempat saya?" [ref=f8e223] [cursor=pointer]
            - paragraph [ref=f8e228]: Ya, betul. Tim teknisi kami akan turun langsung ke lokasi dapur Anda untuk memeriksa instalasi grounding, kestabilan voltase, penyetelan arah putaran motor listrik, kalibrasi kontrol digital suhu/kecepatan, serta memastikan seluruh sistem safety interlock beroperasi dengan aman.
          - generic [ref=f8e229]:
            - button "Berapa lama masa garansi resmi dan apa saja cakupannya?" [ref=f8e230] [cursor=pointer]
            - paragraph [ref=f8e235]: Seluruh mesin industri dari PT Relasi Sukses Bersama dilindungi Garansi Servis Resmi 2 Tahun Penuh (bebas biaya jasa perbaikan & kalibrasi) dan Garansi Suku Cadang Orisinil 1 Tahun untuk komponen mekanis utama, motor penggerak, elemen pemanas, serta modul kontrol PLC jika terjadi cacat produksi.
          - generic [ref=f8e236]:
            - button "Apakah suku cadang (spare parts) selalu ready-stock di Indonesia?" [ref=f8e237] [cursor=pointer]
            - paragraph [ref=f8e242]: Pasti. Kami mengoperasikan gudang sentral suku cadang di Tangerang dan Jakarta Utara serta depo pendukung di Bekasi. Ribuan komponen fast-moving seperti belt, bearing, seal kedap udara, elemen pemanas, thermocouple, dan gear motor selalu tersedia ready-stock sehingga Anda tidak perlu menunggu impor berbulan-bulan saat membutuhkan penggantian.
          - generic [ref=f8e243]:
            - button "Bagaimana proses pengiriman untuk pelanggan di luar pulau Jawa?" [ref=f8e244] [cursor=pointer]
            - paragraph [ref=f8e249]: Kami melayani pengiriman ke seluruh Indonesia (Sumatera, Kalimantan, Sulawesi, Bali, NTB/NTT, hingga Papua). Setiap mesin dipacking menggunakan peti kayu ekspor kokoh (solid wooden crate) berlapis foam anti-guncangan dan dilindungi asuransi kargo penuh. Teknisi kami juga dapat diterbangkan ke lokasi Anda untuk pemasangan dan pelatihan operator.
          - generic [ref=f8e250]:
            - button "Apakah ada pelatihan (training) operasional untuk staf dapur kami?" [ref=f8e251] [cursor=pointer]
            - paragraph [ref=f8e256]: Tentu. Setiap pembelian mesin Relasi Sukses sudah termasuk sesi pelatihan langsung di lokasi usaha Anda. Teknisi kami melatih staf Anda cara pengoperasian yang benar, tips menjaga konsistensi resep, prosedur pembersihan higienis harian, dan perawatan preventif mandiri agar mesin awet belasan tahun.
