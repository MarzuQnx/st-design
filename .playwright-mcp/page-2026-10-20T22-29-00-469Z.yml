        - generic [ref=f1e200]:
          - generic [ref=f1e201]:
            - button "Can I bring my own recipe ingredients to test run the machines prior to purchasing?" [expanded] [ref=f1e202] [cursor=pointer]
            - paragraph [ref=f1e207]: Absolutely, and we strongly encourage it! Every flour dough, sauce viscosity, and snack texture behaves differently. In our Jakarta (PIK) and Bekasi Test Kitchens, bring your proprietary ingredients and run the machines alongside certified engineers at zero fee and with no purchase obligation.
          - generic [ref=f1e208]:
            - button "What is the procedure for scheduling a live machine demo at the showroom?" [ref=f1e209] [cursor=pointer]
            - paragraph [ref=f1e214]: Simply contact us on WhatsApp or fill out the booking form on this page at least 1 business day in advance. Let us know which models you want to test and your sample batch size so our engineers can prep and calibrate the demo machinery.
          - generic [ref=f1e215]:
            - button "What if our kitchen only has single-phase 220V power (not 3-phase 380V)?" [ref=f1e216] [cursor=pointer]
            - paragraph [ref=f1e221]: Many of our units (including 20L Spiral Mixers, Dough Sheeters, SME Encrusting units, Band Sealers, and Gas Deck Ovens) operate seamlessly on standard 220V single-phase power (2,200 - 4,400 VA). For larger 380V machinery, our engineers provide complimentary guidance on phase-converter inverters or utility power upgrades.
          - generic [ref=f1e222]:
            - button "Do Relasi Sukses technicians assist with on-site electrical commissioning upon machine delivery?" [ref=f1e223] [cursor=pointer]
            - paragraph [ref=f1e228]: Yes. Our certified technicians visit your facility to inspect electrical grounding, voltage stability, motor rotation direction, digital temperature/speed calibration, and verify all safety interlock guards.
          - generic [ref=f1e229]:
            - button "How long is the official warranty and what does it cover?" [ref=f1e230] [cursor=pointer]
            - paragraph [ref=f1e235]: All industrial machinery from PT Relasi Sukses Bersama is backed by an Official 2-Year Service Warranty (zero labor fees for repairs & calibration) and a 1-Year Genuine Parts Warranty covering drive motors, mechanical gears, heating bands, and digital PLC controllers against manufacturing defects.
          - generic [ref=f1e236]:
            - button "Are replacement spare parts always in-stock domestically in Indonesia?" [ref=f1e237] [cursor=pointer]
            - paragraph [ref=f1e242]: Absolutely. We operate central parts distribution centers in Tangerang and North Jakarta as well as Bekasi. Thousands of fast-moving items like conveyor belts, food-grade bearings, heating elements, thermocouples, and gearmotors are stocked domestically for same-day or next-day dispatch.
          - generic [ref=f1e243]:
            - button "How does nationwide shipping work for clients outside Java island?" [ref=f1e244] [cursor=pointer]
            - paragraph [ref=f1e249]: We ship nationwide across all Indonesian provinces. Every machine is crated in heavy-duty export-grade solid wood with high-density shock absorbent liners and 100% transit insurance. Certified technicians can be dispatched to your city for on-site commissioning and line training.
          - generic [ref=f1e250]:
            - button "Is hands-on operational coaching provided for our kitchen staff?" [ref=f1e251] [cursor=pointer]
            - paragraph [ref=f1e256]: Yes. Every Relasi Sukses machine delivery includes comprehensive on-site operator coaching. Our technicians train your team on proper startup procedures, recipe consistency adjustments, daily sanitation protocols, and preventive maintenance routines.
