      <stop offset="0%" stop-color="#315C4C" />
      <stop offset="100%" stop-color="#1B382E" />
    </linearGradient>
    <linearGradient id="fav-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E54" />
      <stop offset="100%" stop-color="#E87428" />
    </linearGradient>
